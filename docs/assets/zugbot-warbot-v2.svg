<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 900" role="img" aria-labelledby="title desc">
  <title id="title">ZugBot armored mechanical orc administrator</title>
  <desc id="desc">A heavily armored mechanical orc carrying guild records and a metal command tablet.</desc>
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76706a"/>
      <stop offset=".22" stop-color="#343234"/>
      <stop offset=".58" stop-color="#17191d"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a72d1b"/>
      <stop offset=".5" stop-color="#682017"/>
      <stop offset="1" stop-color="#2d0f0d"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f8752"/>
      <stop offset=".5" stop-color="#5f6b36"/>
      <stop offset="1" stop-color="#2d351e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6b67c"/>
      <stop offset="1" stop-color="#8f6a39"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <filter id="eyeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- backpack and records -->
    <path d="M156 232l142-94 105 38-10 286-198 23-62-144z" fill="#17191d" stroke="#090a0d" stroke-width="18"/>
    <path d="M170 208l38-76 47-12 42 55-23 167-78 25z" fill="#4b3525" stroke="#15100c" stroke-width="12"/>
    <path d="M212 110h58v174h-58zM270 91h54v193h-54zM324 132h53v166h-53z" fill="url(#paper)" stroke="#392717" stroke-width="8"/>
    <path d="M227 161l13 12 12-12-4 17 13 9-17 2-4 16-5-16-17-2 14-9zM286 144l13 12 12-12-4 17 13 9-17 2-4 16-5-16-17-2 14-9zM340 178l12 11 12-11-4 15 12 9-15 2-5 14-4-14-15-2 12-9z" fill="#7f2517"/>

    <!-- torso -->
    <path d="M252 328l87-78 168-3 108 98 20 301-389 9z" fill="url(#iron)" stroke="#08090c" stroke-width="20"/>
    <path d="M295 360l86-60 112 5 86 65-34 207-222 4z" fill="#111318" stroke="#3c221a" stroke-width="14"/>
    <path d="M354 344h166l-11 132-72 61-74-61z" fill="url(#red)" stroke="#31100d" stroke-width="10"/>
    <path d="M390 378l47 35 47-35-15 50 39 30-49 1-22 46-22-46-50-1 40-30z" fill="#170b0a" opacity=".9"/>

    <!-- head -->
    <path d="M348 147l55-60 140 12 59 73-23 131-89 73-102-45-52-102z" fill="url(#skin)" stroke="#111318" stroke-width="16"/>
    <path d="M358 151l55-66 130 13 57 72-17 37-221-18z" fill="url(#iron)" opacity=".72"/>
    <path d="M370 167l53-51 117 10 45 48-26 26-165-8z" fill="#6b522c" opacity=".7"/>
    <path d="M385 189l74 8-28 34-59-7z" fill="#ff4e1f" filter="url(#eyeGlow)"/>
    <path d="M540 204l-66-7 23 40 55 5z" fill="#ff4e1f" filter="url(#eyeGlow)"/>
    <path d="M403 263l134 10-29 80-68 36-66-52z" fill="#24272c" stroke="#0a0b0e" stroke-width="12"/>
    <path d="M411 281l98 9" stroke="#d95720" stroke-width="10" stroke-linecap="round"/>
    <path d="M391 299c-24 4-45 21-62 50 31 11 60 9 88-9z" fill="#e9d4a5" stroke="#6a5237" stroke-width="8"/>
    <path d="M526 312c25 7 44 26 56 57-33 7-61 1-86-20z" fill="#e9d4a5" stroke="#6a5237" stroke-width="8"/>

    <!-- Z crest -->
    <path d="M433 111h79l20 42H414z" fill="#9f321c" stroke="#42120d" stroke-width="7"/>
    <path d="M438 119h65v11l-35 31h39v16h-73v-13l37-30h-33z" fill="#fff0db"/>

    <!-- shoulder plates -->
    <path d="M198 342l107-89 77 42-37 173-135 20-63-90z" fill="url(#red)" stroke="#0b0c0f" stroke-width="18"/>
    <path d="M552 299l98-55 86 61-15 155-122 27-65-86z" fill="url(#red)" stroke="#0b0c0f" stroke-width="18"/>
    <path d="M216 361l48-17 53 28-33 70-74 3zM579 330l50-24 58 31-7 75-77 21z" fill="#16181c" opacity=".5"/>

    <!-- left arm -->
    <path d="M185 456l105-15 48 76-35 230-95 22-65-134z" fill="url(#iron)" stroke="#08090b" stroke-width="18"/>
    <path d="M173 560l119-16 20 75-107 24z" fill="#6e2418" stroke="#111216" stroke-width="12"/>
    <path d="M221 665l94-28 39 72-68 76-94-31z" fill="#1c1e22" stroke="#08090b" stroke-width="15"/>

    <!-- right arm + command tablet -->
    <path d="M596 452l106-15 71 92-59 190-91 6-65-108z" fill="url(#iron)" stroke="#08090b" stroke-width="18"/>
    <path d="M625 561l78-36 56 51-40 114-86-18z" fill="#1b1d21" stroke="#08090b" stroke-width="14"/>
    <g transform="translate(584 430) rotate(-12)">
      <rect x="86" y="-3" width="166" height="230" rx="18" fill="#111318" stroke="#4b4f56" stroke-width="12"/>
      <rect x="105" y="20" width="128" height="184" rx="9" fill="#080a0d" stroke="#742419" stroke-width="5"/>
      <path d="M129 57h80M129 88h80M129 119h62M129 150h74" stroke="#d85a2c" stroke-width="7" stroke-linecap="round" opacity=".85"/>
      <circle cx="115" cy="57" r="5" fill="#ff7136"/><circle cx="115" cy="88" r="5" fill="#ff7136"/><circle cx="115" cy="119" r="5" fill="#ff7136"/><circle cx="115" cy="150" r="5" fill="#ff7136"/>
    </g>

    <!-- belt and cloth -->
    <path d="M293 566h316l-7 70-298 7z" fill="#2a201a" stroke="#0b0c0e" stroke-width="12"/>
    <circle cx="447" cy="604" r="39" fill="#24272c" stroke="#7a4b2c" stroke-width="10"/>
    <path d="M380 622h141l-13 210-61 49-59-49z" fill="url(#red)" stroke="#2a0d0a" stroke-width="10"/>
    <path d="M403 663l44 31 43-31-14 44 35 26-44 2-20 41-20-41-44-2 36-26z" fill="#130907"/>

    <!-- plates and rivets -->
    <g fill="#9d7452">
      <circle cx="227" cy="333" r="6"/><circle cx="276" cy="307" r="6"/><circle cx="317" cy="401" r="6"/>
      <circle cx="605" cy="304" r="6"/><circle cx="662" cy="333" r="6"/><circle cx="621" cy="419" r="6"/>
      <circle cx="257" cy="511" r="6"/><circle cx="684" cy="506" r="6"/><circle cx="340" cy="592" r="6"/><circle cx="550" cy="592" r="6"/>
    </g>

    <!-- chains/wires -->
    <path d="M205 258c-37 26-38 91 13 112M592 218c46 15 58 76 26 111" fill="none" stroke="#4b4e52" stroke-width="13" stroke-linecap="round"/>
    <path d="M203 258c-37 26-38 91 13 112M592 218c46 15 58 76 26 111" fill="none" stroke="#16181c" stroke-width="5" stroke-dasharray="12 13" stroke-linecap="round"/>
  </g>
</svg>