<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fiery orcish fortress backdrop</title>
  <desc id="desc">A dark fantasy fortress with towers, spikes, banners, smoke, firelight, and drifting embers.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161923"/>
      <stop offset=".42" stop-color="#251812"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <radialGradient id="sun" cx="74%" cy="37%" r="38%">
      <stop offset="0" stop-color="#ff7b2d" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#b83a1c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29242a"/>
      <stop offset=".5" stop-color="#17171b"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f2018"/>
      <stop offset="1" stop-color="#35100f"/>
    </linearGradient>
    <filter id="fireGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
