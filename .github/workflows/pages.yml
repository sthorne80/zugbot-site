name: Build and review ZugBot website

on:
  pull_request:
  push:
    branches: [main, design/astro-homepage-phase-1]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed main commit to GitHub Pages
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: website-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: homepage/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix homepage ci
      - name: Build and validate the entire static site
        run: python homepage/build.py
      - name: Save a downloadable review build
        uses: actions/upload-artifact@v4
        with:
          name: zugbot-site-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: homepage/dist
          if-no-files-found: error
          retention-days: 7
      - name: Package the approved main build for Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: homepage/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: zugbot-production-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the reviewed Pages artifact
        uses: actions/deploy-pages@v4
        id: deployment
